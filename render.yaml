# Render Blueprint: one click deploys the whole platform (web service + free PostgreSQL).
# Dashboard -> New -> Blueprint -> pick this repository (branch main). See docs/CLOUD_DEPLOY.md.
services:
  - type: web
    name: healthresponse
    runtime: docker
    dockerfilePath: ./Dockerfile.cloud
    dockerContext: .
    plan: free
    branch: main
    healthCheckPath: /actuator/health/liveness
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: healthresponse-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_DEMO_DATA
        value: "true"
      # Password for ALL demo accounts. You type it once in the Render dashboard (it is not stored in git).
      - key: SEED_DEMO_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: ""
      - key: RATE_LIMIT_AUTH_PER_MINUTE
        value: "30"
      - key: FORWARD_HEADERS
        value: framework # Render's proxy sets X-Forwarded-For
      - key: AI_PROVIDER
        value: deterministic-demo
      # Optional channels (leave empty to disable) - see docs/INTEGRATIONS.md
      - key: MAIL_HOST
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false

databases:
  - name: healthresponse-db
    plan: free
    databaseName: healthplatform
    user: healthapp
