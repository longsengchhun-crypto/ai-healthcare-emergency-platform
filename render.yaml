# Render Blueprint: one click deploys the whole platform (web service + free PostgreSQL).
# Dashboard -> New -> Blueprint -> pick this repository (branch main). See docs/CLOUD_DEPLOY.md.
services:
  - type: web
    name: healthresponse
    runtime: docker
    dockerfilePath: ./Dockerfile.cloud
    dockerContext: .
    plan: free
    branch: main
    healthCheckPath: /actuator/health/liveness
    autoDeploy: true
    envVars:
      # Neon (free, does not expire). Paste the DIRECT connection string (host WITHOUT "-pooler") in the Render
      # dashboard. The demo data is already seeded there, so the accounts keep their existing password.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_DEMO_DATA
        value: "true"
      # Password for ALL demo accounts. You type it once in the Render dashboard (it is not stored in git).
      - key: SEED_DEMO_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: ""
      - key: RATE_LIMIT_AUTH_PER_MINUTE
        value: "30"
      - key: FORWARD_HEADERS
        value: framework # Render's proxy sets X-Forwarded-For
      # AI: deterministic-demo = rules only (no data leaves the server). anthropic = Claude on top of the rules; it also
      # needs AI_API_KEY (paste it in the Render dashboard, never in git). Without the key the app keeps working on rules.
      - key: AI_PROVIDER
        value: anthropic
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: claude-opus-5-5
      - key: AI_TIMEOUT_SECONDS
        value: "20"
      - key: AI_MAX_RETRIES
        value: "2"
      - key: AI_RATE_LIMIT_PER_MINUTE
        value: "10"
      # Optional channels (leave empty to disable) - see docs/INTEGRATIONS.md
      - key: MAIL_HOST
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
