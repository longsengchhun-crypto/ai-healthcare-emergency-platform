name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Build and test (H2 + embedded PostgreSQL)
        working-directory: backend
        run: mvn -B verify

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Analyze and test
        working-directory: apps/mobile
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test
      - name: Debug APK build
        working-directory: apps/mobile
        run: flutter build apk --debug --dart-define=API_BASE_URL=https://api.example.invalid

  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        env: { DB_PASSWORD: ci-only, JWT_SECRET: ci-only-ci-only-ci-only-ci-only-0123 }
        run: docker compose -f infrastructure/docker-compose.yml config -q
