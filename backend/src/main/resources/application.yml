spring:
  application:
    name: platform-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/healthplatform}
    username: ${DB_USER:healthapp}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  jackson:
    default-property-inclusion: non_null
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

server:
  port: ${PORT:8080}
  # Set FORWARD_HEADERS=framework behind a TLS proxy so rate limiting sees real client IPs.
  forward-headers-strategy: ${FORWARD_HEADERS:none}
  error:
    include-stacktrace: never
    include-message: never

management:
  health:
    mail:
      # An unreachable mail server must not make the whole API report DOWN.
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    # Must be supplied via environment in every non-test deployment (min 32 bytes).
    secret: ${JWT_SECRET:}
    access-ttl-minutes: 15
    refresh-ttl-days: 14
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081}
  storage:
    root: ${STORAGE_ROOT:./data/private-documents}
  seed:
    # Demo accounts are created only when this is true AND a demo password is supplied.
    demo-enabled: ${SEED_DEMO_DATA:false}
    demo-password: ${SEED_DEMO_PASSWORD:}
  ai:
    provider: ${AI_PROVIDER:deterministic-demo}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:claude-opus-5-5}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:20}
    max-retries: ${AI_MAX_RETRIES:2}
    rate-limit-per-minute: ${AI_RATE_LIMIT_PER_MINUTE:10}
    base-url: ${AI_BASE_URL:}
  fcm:
    enabled: ${FCM_ENABLED:false}
  rate-limit:
    auth-per-minute: ${RATE_LIMIT_AUTH_PER_MINUTE:10}
